name: ci

on:
  push:
  pull_request:

jobs:
  # Native runners: Linux (glibc, x86_64) and macOS (arm64).
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          cc --version
          make --version | head -1

      - name: Linux deps (liburing for io_uring + hyperfine)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y liburing-dev hyperfine || true

      - name: macOS deps (hyperfine)
        if: runner.os == 'macOS'
        run: brew install hyperfine || true

      - name: Configure + build (warnings = errors)
        run: |
          ./configure
          make CFLAGS="-O2 -Werror"

      - name: Unit + golden parity tests
        run: make test

      - name: io_uring backend parity (Linux, when liburing detected)
        if: runner.os == 'Linux'
        run: |
          if grep -q 'ASP_HAS_LIBURING = 1' config.mk; then
            ASP_IO=uring make test
          else
            echo "liburing not detected — skipping io_uring gate"
          fi

      - name: Sanitizer build (ASan/UBSan)
        run: make debug

      - name: Benchmark + perf gate
        run: make bench

  # FreeBSD (dev platform) in a VM on the Linux runner.
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y git gmake
          run: |
            ./configure
            gmake CFLAGS="-O2 -Werror"
            gmake test

  # musl libc (static-release target) via musl-gcc on the Linux runner. (An
  # Alpine container can't host the node-based actions — checkout needs glibc.)
  musl:
    runs-on: ubuntu-latest
    env:
      CC: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: musl toolchain
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools
      - name: Configure + build (warnings = errors)
        run: |
          ./configure
          make CFLAGS="-O2 -Werror"
      - name: Unit + golden parity tests
        run: make test
